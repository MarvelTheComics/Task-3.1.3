<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registration</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5 d-flex justify-content-center">
    <div style="width: 350px;">

        <h2 class="mb-4 text-center">Введите данные</h2>

        <form id="createUser">
            <div class="mb-3 center">
                <label for="emailCreate" class="form-label text-center fw-bold w-100">Email</label>
                <input id="emailCreate" type="email" class="form-control mx-auto" required style="width: 220px;" name="email">
            </div>
            <div class="mb-3 center">
                <label for="nameCreate" class="form-label text-center fw-bold w-100">Имя</label>
                <input type="text" class="form-control mx-auto" id="nameCreate" required minlength="2" maxlength="15" style="width: 220px;" name="name">
            </div>
            <div class="mb-3 center">
                <label for="secondNameCreate" class="form-label text-center fw-bold w-100">Фамилия</label>
                <input type="text" class="form-control mx-auto" id="secondNameCreate" minlength="2" maxlength="35" style="width: 220px;" name="secondName">
            </div>
            <div class="mb-3 center">
                <label for="eyeColorCreate" class="form-label text-center fw-bold w-100">Цвет глаз</label>
                <input type="text" class="form-control mx-auto" id="eyeColorCreate" minlength="2" style="width: 220px;" name="eyeColor">
            </div>
            <div class="mb-3 center">
                <label for="ageCreate" class="form-label text-center fw-bold w-100">Возраст</label>
                <input type="number" class="form-control mx-auto" id="ageCreate" min="2" style="width: 220px;" name="age">
            </div>
            <div class="mb-3 center">
                <label for="passwordCreate" class="form-label text-center fw-bold w-100">Пароль</label>
                <input type="password" class="form-control mx-auto" id="passwordCreate" required minlength="6" style="width: 220px;" name="password">
            </div>
            <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/registration.js"></script>
</body>
</html>
