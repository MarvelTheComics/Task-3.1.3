<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
    <title>UserInfo</title>
</head>
<body>
<nav class="navbar fixed-top navbar-dark bg-dark">
    <div class="container-fluid text-white d-flex align-items-center">
        <div class="d-flex align-items-center gap-1" id="myHeader"></div>
        <form th:action="@{/logout}" method="POST" class="m-0">
            <button type="submit" class="btn btn-secondary border-0 bg-transparent text-secondary">
                Logout
            </button>
        </form>
    </div>
</nav>
<br>
<br>

<div class="d-flex">
    <div class="nav flex-column nav-pills min-vh-100" aria-orientation="vertical" style="width: 220px;">
        <a class="nav-link w-100 text-start mt-3" th:href="@{/users}" sec:authorize="hasRole('ADMIN')">Admin</a>
        <a class="nav-link active w-100 text-start mt-3" th:href="@{/me}">User</a>
    </div>
    <div class="flex-grow-1 p-4 bg-body-secondary min-vh-100">
        <h2 class="mb-4">Страница пользователя</h2>
        <div class="card">
            <div class="card-header fw-bold">Информация</div>
            <table class="table table-striped mb-0">
                <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Email</th>
                    <th scope="col">Имя</th>
                    <th scope="col">Фамилия</th>
                    <th scope="col">Возраст</th>
                    <th scope="col">Цвет глаз</th>
                    <th scope="col">Роли</th>
                </tr>
                </thead>
                <tbody id="myInfo"></tbody>
            </table>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script src="/js/me.js"></script>
</body>
</html>
