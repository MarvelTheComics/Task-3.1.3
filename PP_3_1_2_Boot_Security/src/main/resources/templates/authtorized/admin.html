<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
    <title>AdminUtils</title>
</head>
<body>
<nav class="navbar fixed-top navbar-dark bg-dark">
    <div class="container-fluid text-white d-flex align-items-center">
        <div class="d-flex align-items-center gap-1" id="myHeader"></div>
        <div class="m-0">
            <a type="submit" class="btn btn-secondary border-0 bg-transparent text-secondary" href="/logout">
                Logout
            </a>
        </div>
    </div>
</nav>
<br>
<br>

<div class="d-flex">
    <div class="nav flex-column nav-pills min-vh-100" aria-orientation="vertical" style="width: 220px;">
        <a class="nav-link active w-100 mt-3" href="/users">Admin</a>
        <a class="nav-link w-100 mt-3" href="/me">User</a>
    </div>
    <div class="flex-grow-1 p-4 bg-body-secondary min-vh-100">
        <h2 class="mb-4">Страница администратора</h2>
        <nav>
            <div class="nav nav-tabs" id="nav-tab" role="tablist">
                <button class="nav-link active" id="nav-table-tab" data-bs-toggle="tab" data-bs-target="#nav-table" type="button" role="tab" aria-controls="nav-table" aria-selected="true">Таблица пользователей</button>
                <button class="nav-link" id="nav-profile-tab" data-bs-toggle="tab" data-bs-target="#nav-profile" type="button" role="tab" aria-controls="nav-profile" aria-selected="false">Создать пользователя</button>
            </div>
        </nav>
        <div class="tab-content" id="nav-tabContent">
            <div class="tab-pane fade show active" id="nav-table" role="tabpanel" aria-labelledby="nav-home-tab">
                <div class="card">
                    <div class="card-header fw-bold">Все пользователи</div>
                    <table class="table table-striped mb-0">
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Email</th>
                                <th scope="col">Имя</th>
                                <th scope="col">Фамилия</th>
                                <th scope="col">Возраст</th>
                                <th scope="col">Цвет глаз</th>
                                <th scope="col">Роли</th>
                                <th scope="col">Edit</th>
                                <th scope="col">Delete</th>
                            </tr>
                        </thead>
                        <tbody id="usersInfo"></tbody>
                    </table>
                </div>
            </div>
            <div class="tab-pane fade" id="nav-profile" role="tabpanel" aria-labelledby="nav-profile-tab">
                <div class="card">
                    <div class="card-header fw-bold">Форма</div>
                    <form id="createUser">
                        <div class="mb-3 center">
                            <label for="emailCreate" class="form-label text-center fw-bold w-100">Email</label>
                            <input id="emailCreate" type="email" class="form-control mx-auto" required style="width: 220px;" name="email">
                        </div>
                        <div class="mb-3 center">
                            <label for="nameCreate" class="form-label text-center fw-bold w-100">Имя</label>
                            <input type="text" class="form-control mx-auto" id="nameCreate" required minlength="2" maxlength="15" style="width: 220px;" name="name">
                        </div>
                        <div class="mb-3 center">
                            <label for="secondNameCreate" class="form-label text-center fw-bold w-100">Фамилия</label>
                            <input type="text" class="form-control mx-auto" id="secondNameCreate" minlength="2" maxlength="35" style="width: 220px;" name="secondName">
                        </div>
                        <div class="mb-3 center">
                            <label for="eyeColorCreate" class="form-label text-center fw-bold w-100">Цвет глаз</label>
                            <input type="text" class="form-control mx-auto" id="eyeColorCreate" minlength="2" style="width: 220px;" name="eyeColor">
                        </div>
                        <div class="mb-3 center">
                            <label for="ageCreate" class="form-label text-center fw-bold w-100">Возраст</label>
                            <input type="number" class="form-control mx-auto" id="ageCreate" min="2" style="width: 220px;" name="age">
                        </div>
                        <div class="mb-3 center">
                            <label for="passwordCreate" class="form-label text-center fw-bold w-100">Пароль</label>
                            <input type="password" class="form-control mx-auto" id="passwordCreate" required minlength="6" style="width: 220px;" name="password">
                        </div>
                        <div class="mb-3 center">
                            <label for="roleCreate" class="form-label text-center fw-bold w-100">Роль</label>
                            <select name="roleId" class="form-select mx-auto" id="roleCreate" style="width: 220px;">
                                <option value="1">USER</option>
                                <option value="2">ADMIN</option>
                            </select>
                        </div>
                        <div class="d-grid gap-2 col-4 mx-auto">
                            <button type="submit" class="btn btn-success">Создать</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content d-flex">
            <form id="deleteUser">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="deleteModalLabel">Delete User</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3 center">
                        <label for="idDelete" class="form-label text-center fw-bold w-100">ID</label>
                        <input type="text" class="form-control mx-auto bg-body-secondary" style="width: 220px;" id="idDelete" readonly>
                    </div>
                    <div class="mb-3 center">
                        <label for="emailDelete" class="form-label text-center fw-bold w-100">Email</label>
                        <input type="text" class="form-control mx-auto bg-body-secondary" style="width: 220px;" id="emailDelete" readonly>
                    </div>
                    <div class="mb-3 center">
                        <label for="nameDelete" class="form-label text-center fw-bold w-100">Имя</label>
                        <input type="text" class="form-control mx-auto bg-body-secondary" style="width: 220px;" id="nameDelete" readonly>
                    </div>
                    <div class="mb-3 center">
                        <label for="secondNameDelete" class="form-label text-center fw-bold w-100">Фамилия</label>
                        <input type="text" class="form-control mx-auto bg-body-secondary" style="width: 220px;" id="secondNameDelete" readonly>
                    </div>
                    <div class="mb-3 center">
                        <label for="eyeColorDelete" class="form-label text-center fw-bold w-100">Цвет глаз</label>
                        <input type="text" class="form-control mx-auto bg-body-secondary" style="width: 220px;" id="eyeColorDelete" readonly>
                    </div>
                    <div class="mb-3 center">
                        <label for="ageDelete" class="form-label text-center fw-bold w-100">Возраст</label>
                        <input type="text" class="form-control mx-auto bg-body-secondary" style="width: 220px;" id="ageDelete" readonly>
                    </div>
                    <div class="mb-3 center">
                        <label for="roleDelete" class="form-label text-center fw-bold w-100">Роль</label>
                        <input type="text" class="form-control mx-auto bg-body-secondary" style="width: 220px;" id="roleDelete" readonly>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-danger">Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content d-flex">
            <form id="editUser">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="editModalLabel">Edit User</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3 center">
                        <label for="idEdit" class="form-label text-center fw-bold w-100">ID</label>
                        <input type="text" class="form-control mx-auto bg-body-secondary" style="width: 220px;" id="idEdit" readonly>
                    </div>
                    <div class="mb-3 center">
                        <label for="emailEdit" class="form-label text-center fw-bold w-100">Email</label>
                        <input type="text" class="form-control mx-auto bg-body-secondary" style="width: 220px;" id="emailEdit" required>
                    </div>
                    <div class="mb-3 center">
                        <label for="nameEdit" class="form-label text-center fw-bold w-100">Имя</label>
                        <input type="text" class="form-control mx-auto bg-body-secondary" style="width: 220px;" id="nameEdit" required minlength="2" maxlength="15">
                    </div>
                    <div class="mb-3 center">
                        <label for="secondNameEdit" class="form-label text-center fw-bold w-100">Фамилия</label>
                        <input type="text" class="form-control mx-auto bg-body-secondary" style="width: 220px;" id="secondNameEdit" minlength="2" maxlength="35">
                    </div>
                    <div class="mb-3 center">
                        <label for="eyeColorEdit" class="form-label text-center fw-bold w-100">Цвет глаз</label>
                        <input type="text" class="form-control mx-auto bg-body-secondary" style="width: 220px;" id="eyeColorEdit" minlength="2">
                    </div>
                    <div class="mb-3 center">
                        <label for="ageEdit" class="form-label text-center fw-bold w-100">Возраст</label>
                        <input type="number" class="form-control mx-auto bg-body-secondary" style="width: 220px;" id="ageEdit" min="2">
                    </div>
                    <div class="mb-3 center">
                        <label for="roleEdit" class="form-label text-center fw-bold w-100">Роль</label>
                        <select name="roleId" class="form-select mx-auto bg-body-secondary" id="roleEdit" style="width: 220px;" required>
                            <option value="1">USER</option>
                            <option value="2">ADMIN</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Edit</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script src="/js/admin.js"></script>
<script src="/js/registration.js"></script>
</body>
</html>
